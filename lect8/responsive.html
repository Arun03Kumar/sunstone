<!doctype html>
<html lang="en">
  <head>
    <title>Document</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      .header {
        background: red;
        height: 100px;
        width: 100%;
      }

      @media (min-width: 700px) {
        .header {
          background: green;
          font-size: 2rem;
        }
      }

      @media (min-width: 1000px) {
        .header {
          background: blue;
          font-size: 3rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="header">header</div>
  </body>
</html>
