<!doctype html>
<html lang="en">
  <head>
    <title>Grid</title>
    <style>
      .grid {
        display: grid;
        /* grid-template-columns: repeat(3, auto); */
        grid-template-columns: 150px minmax(200px, 1fr) 150px;
        grid-template-rows: 1fr 1fr;
        gap: 10px;
      }
      .grid-item {
        background-color: lightblue;
        border: 1px solid black;
        width: auto;
        height: 100px;
      }
    </style>
  </head>
  <body>
    <div class="grid">
      <div class="grid-item"></div>
      <div class="grid-item"></div>
      <div class="grid-item"></div>
      <div class="grid-item"></div>
      <div class="grid-item"></div>
      <div class="grid-item"></div>
    </div>
  </body>
</html>
