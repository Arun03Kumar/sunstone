<!doctype html>
<html lang="en">
  <head>
    <title>Photo Gallery</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Arial, sans-serif;
        background-color: #f0f0f0;
        padding: 20px;
      }
      .gallery {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 15px;
      }
      .gallery img {
        width: 100%;
        height: 250px;
        border-radius: 8px;
        object-fit: cover;
        transition: transform 0.3s ease;
      }
      .feature {
        grid-column: span 2;
        grid-row: span 2;
        height: auto !important;
      }
    </style>
  </head>
  <body>
    <div class="gallery">
      <img src="https://picsum.photos/300?1" class="feature" alt="Photo 1" />
      <img src="https://picsum.photos/300?2" alt="Photo 2" />
      <img src="https://picsum.photos/300?3" alt="Photo 3" />
      <img src="https://picsum.photos/300?4" alt="Photo 4" />
      <img src="https://picsum.photos/300?5" alt="Photo 5" />
      <img src="https://picsum.photos/300?6" alt="Photo 6" />
      <img src="https://picsum.photos/300?7" alt="Photo 7" />
      <img src="https://picsum.photos/300?8" alt="Photo 8" />
      <img src="https://picsum.photos/300?9" alt="Photo 9" />
      <img src="https://picsum.photos/300?10" alt="Photo 10" />
    </div>
  </body>
</html>
