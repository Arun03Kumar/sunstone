<!doctype html>
<html lang="en">
  <head>
    <title>Magazine layout</title>
    <style>
      .container {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        height: 100vh;
      }

      .container div {
        background-color: lightgray;
        padding: 20px;
        text-align: center;
      }

      .featured {
        grid-column: span 2;
        background-color: lightblue;
        grid-row: span 2;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="featured">Featured Article</div>
      <div class="article">Article 1</div>
      <div class="article">Article 2</div>
      <div class="article">Article 3</div>
      <div class="article">Article 4</div>
    </div>
  </body>
</html>
