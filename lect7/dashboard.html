<!doctype html>
<html lang="en">
  <head>
    <title>Dashboard</title>
    <style>
      .container {
        display: grid;
        grid-template-columns: 1fr 3fr;
        grid-template-rows: auto 1fr auto;
        gap: 10px;
        grid-template-areas:
          "header header"
          "sidebar main"
          "footer footer";
        height: 100vh;
      }
      header {
        grid-area: header;
        background-color: lightblue;
        padding: 20px;
        text-align: center;
      }
      aside {
        grid-area: sidebar;
        background-color: lightgray;
        padding: 20px;
      }
      main {
        grid-area: main;
        background-color: pink;
        padding: 20px;
      }
      footer {
        grid-area: footer;
        background-color: lightgreen;
        padding: 20px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>Header</header>
      <aside>Sidebar</aside>
      <main>Main Content</main>
      <footer>Footer</footer>
    </div>
  </body>
</html>
