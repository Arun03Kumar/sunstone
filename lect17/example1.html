<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <ul>
      <li data-id="1">Product 1 <button>delete</button></li>
      <li data-id="2">Product 2 <button>delete</button></li>
      <li data-id="3">Product 3 <button>delete</button></li>
    </ul>

    <script>
      const buttons = document.querySelectorAll("button");
      buttons.forEach((btn) => {
        btn.addEventListener("click", () => {
          const li = btn.parentElement;
          console.log(li.dataset.id);
          li.remove();
        });
      });
    </script>
  </body>
</html>
