<!doctype html>
<html lang="en">
  <head>
    <title>Flexbox</title>
    <style>
      ul {
        display: flex;
        flex-direction: row;
        gap: 20px;
        list-style-type: none;
        background-color: #f0f0f0;
        padding: 10px;

        justify-content: center;
        align-items: center;
        flex-wrap: wrap;
      }
      li {
        background-color: #007bff;
        color: white;
        padding: 10px 20px;
        border-radius: 5px;
        cursor: pointer;
      }
      li:hover {
        background-color: #0056b3;
      }
      a {
        color: white;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <ul>
      <li><a href="#">Home</a></li>

</html>
