<!doctype html>
<html>
  <head>
    <style>
      * {
        font-size: 20px;
      }
      h1 {
        font-size: 60px;
        border: 2px solid black;
        padding: 50px;
        margin: 150px;
      }

      /* p {
        font-size: 3em;
        line-height: 50px;
      } */

      .container {
        width: 500px;
        height: 500px;
        background-color: lightblue;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 5rem;
      }

      .inner {
        background-color: lightcoral;
        padding: 20px;
        width: 250px;
      }

      .inner p {
        font-size: 3rem;
      }

      .div2 {
        font-size: 3rem;
        background-color: lightgreen;
        width: 100vw;
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <h1>This is heading 1</h1>
    <h2>This is heading 2</h2>
    <p>This is a paragraph.</p>
    <p>This is another paragraph.</p>

    <div class="container">
      <div class="inner">
        <p>inside div</p>
      </div>
    </div>

    <div class="div2">text</div>
  </body>
</html>
