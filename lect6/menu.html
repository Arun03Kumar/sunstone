<!doctype html>
<html>
  <head>
    <title>Responsive Navigation Menu</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Arial, sans-serif;
      }

      nav {
        background-color: #333;
        padding: 15px 20px;
      }

      .nav-container {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .logo {
        color: white;
        font-size: 24px;
        font-weight: bold;
      }

      .nav-links {
        display: flex;
        list-style: none;
        gap: 20px;
      }

      .nav-links a {
        color: white;
        text-decoration: none;
        padding: 8px 12px;
      }

      .nav-links a:hover {
        background-color: #555;
        border-radius: 5px;
      }

      /* Responsive Design */
      @media (max-width: 600px) {
        .nav-container {
          flex-direction: column;
          gap: 10px;
        }

        .nav-links {
          flex-direction: column;
          width: 100%;
          text-align: center;
        }
      }
    </style>
  </head>

  <body>
    <nav>
      <div class="nav-container">
        <div class="logo">MyWebsite</div>

        <ul class="nav-links">
          <li><a href="#">Home</a></li>
          <li><a href="#">About</a></li>
          <li><a href="#">Services</a></li>
          <li><a href="#">Contact</a></li>
        </ul>
      </div>
    </nav>
  </body>
</html>
