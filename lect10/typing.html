<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .typing {
        width: 0;
        overflow: hidden;
        white-space: nowrap;
        border-right: 3px solid black;
        animation:
          typing 4s steps(25) forwards,
          blink 0.5s infinite;
      }
      @keyframes typing {
        to {
          width: 25ch;
        }
      }

      @keyframes blink {
        50% {
          border-color: transparent;
        }
      }
    </style>
  </head>
  <body>
    <h1 class="typing">Welcome to something else.</h1>
  </body>
</html>
