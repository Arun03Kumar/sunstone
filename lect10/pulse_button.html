<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      button {
        padding: 10px 20px;
        font-size: 16px;
        background-color: #007bff;
        border: none;
        color: white;
        cursor: pointer;
        border-radius: 8px;
        animation: pulse 1s ease-in-out infinite;
      }
      @keyframes pulse {
        0% {
          transform: scale(1);
          background-color: #007bff;
        }
        50% {
          transform: scale(1.2);
          background-color: #0056b3;
        }
        100% {
          transform: scale(1);
          background-color: #007bff;
        }
      }
    </style>
  </head>
  <body>
    <button>click me</button>
  </body>
</html>
