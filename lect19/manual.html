<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1 id="counter">0</h1>
    <button onClick="increment()">inc</button>

    <script>
      let count = 0;

      function increment() {
        count++;
        document.getElementById("counter").textContent = count;
      }
    </script>
  </body>
</html>
